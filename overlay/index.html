<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSN Overlay</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="stage">
  <header id="topbar">
    <div id="streamer-name"></div>
    <div id="streamer-tagline"></div>
  </header>
  <div id="upper">
    <div id="gameplay"></div>
    <aside id="rail">
      <div id="facecam"></div>
      <header id="board-head">
        <div class="eyebrow">Match info</div>
        <div id="stat-name" class="flaprow"></div>
      </header>
      <div id="board"></div>
    </aside>
  </div>
  <footer id="chiron">
    <div id="logo-bay"></div>
    <div id="chiron-body">
      <div id="spine"></div>
      <div id="groups"></div>
      <div id="persistent"></div>
    </div>
  </footer>
  <div id="veil"></div>
  <div id="ident"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
